services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kresearch
      POSTGRES_PASSWORD: kresearch
      POSTGRES_DB: kresearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kresearch -d kresearch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
