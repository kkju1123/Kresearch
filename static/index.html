<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KResearch</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #5b8def;
    --ok: #3ecf8e;
    --warn: #e0a940;
    --err: #e05a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main { width: 100%; max-width: 760px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  form { display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 13px; color: var(--muted); }
  input[type=text], input[type=number] {
    width: 100%;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
  }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  .row > div:first-child { flex: 1; }
  .row > div:last-child { width: 120px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #3a4152; cursor: not-allowed; }
  .status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    padding: 6px 0;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.active { background: var(--accent); box-shadow: 0 0 0 4px rgba(91,141,239,0.2); }
  .dot.done { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.err { background: var(--err); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  #report { line-height: 1.65; font-size: 15px; }
  #report h1, #report h2, #report h3 { color: var(--text); }
  #report a { color: var(--accent); }
  #report code { background: #0f1115; padding: 2px 5px; border-radius: 4px; }
  .hidden { display: none; }
  .badge {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .badge.done { background: rgba(62,207,142,0.15); color: var(--ok); }
  .badge.partial { background: rgba(224,169,64,0.15); color: var(--warn); }
  .badge.failed { background: rgba(224,90,90,0.15); color: var(--err); }
  .issues { font-size: 13px; color: var(--warn); margin-top: 12px; }
  .issues li { margin-bottom: 4px; }
</style>
</head>
<body>
<main>
  <h1>KResearch</h1>
  <div class="subtitle">Deep Research Agent — 提交一个问题，看它自己搜索、抓取、验证、写报告</div>

  <div class="card">
    <form id="task-form">
      <div class="row">
        <div>
          <label for="query">研究问题</label>
          <input type="text" id="query" placeholder="例如：What is the capital of Canada?" required>
        </div>
        <div>
          <label for="budget">预算 ($)</label>
          <input type="number" id="budget" value="0.3" step="0.05" min="0.01" required>
        </div>
      </div>
      <button type="submit" id="submit-btn">开始研究</button>
    </form>
  </div>

  <div class="card hidden" id="progress-card">
    <div id="status-lines"></div>
    <div class="meta" id="meta-line"></div>
  </div>

  <div class="card hidden" id="report-card">
    <div id="report"></div>
    <ul class="issues hidden" id="issues"></ul>
  </div>
</main>

<script>
const PHASES = ["pending", "planning", "executing", "verifying", "synthesizing", "done"];
const PHASE_LABELS = {
  pending: "排队中",
  planning: "拆解问题、规划子查询",
  executing: "检索并抓取网页",
  verifying: "核查证据是否支持论点",
  synthesizing: "撰写报告草稿",
  done: "完成",
  partial: "部分完成（有未解决的疑点）",
  failed: "失败",
};

const form = document.getElementById("task-form");
const submitBtn = document.getElementById("submit-btn");
const progressCard = document.getElementById("progress-card");
const statusLines = document.getElementById("status-lines");
const metaLine = document.getElementById("meta-line");
const reportCard = document.getElementById("report-card");
const reportDiv = document.getElementById("report");
const issuesList = document.getElementById("issues");

let seenStatuses = [];

function renderStatusLines(current, spent, budget) {
  statusLines.innerHTML = "";
  const order = ["pending", "planning", "executing", "verifying", "synthesizing", current];
  const uniqueOrder = [...new Set(PHASES.includes(current) ? PHASES.slice(0, PHASES.indexOf(current) + 1) : [...PHASES, current])];

  for (const phase of uniqueOrder) {
    const line = document.createElement("div");
    line.className = "status-line";
    const dot = document.createElement("div");
    let dotClass = "dot";
    if (phase === current) {
      if (phase === "done") dotClass += " done";
      else if (phase === "partial") dotClass += " warn";
      else if (phase === "failed") dotClass += " err";
      else dotClass += " active";
    } else {
      dotClass += " done";
    }
    dot.className = dotClass;
    const label = document.createElement("span");
    label.textContent = PHASE_LABELS[phase] || phase;
    line.appendChild(dot);
    line.appendChild(label);
    statusLines.appendChild(line);
  }
  metaLine.textContent = `花费 $${spent.toFixed(6)} / $${budget.toFixed(4)}`;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = document.getElementById("query").value.trim();
  const budget = parseFloat(document.getElementById("budget").value);
  if (!query) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "运行中...";
  progressCard.classList.remove("hidden");
  reportCard.classList.add("hidden");
  issuesList.classList.add("hidden");
  statusLines.innerHTML = "";
  metaLine.textContent = "";

  const resp = await fetch("/research/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, budget }),
  });
  if (!resp.ok) {
    metaLine.textContent = "提交失败: " + resp.status;
    submitBtn.disabled = false;
    submitBtn.textContent = "开始研究";
    return;
  }
  const { task_id } = await resp.json();

  const es = new EventSource(`/research/tasks/${task_id}/stream`);
  es.onmessage = (event) => {
    const data = JSON.parse(event.data);
    renderStatusLines(data.status, data.spent, data.budget);
    if (["done", "partial", "failed", "cancelled", "timed_out"].includes(data.status)) {
      es.close();
      finishUp(task_id);
    }
  };
  es.onerror = () => {
    es.close();
    submitBtn.disabled = false;
    submitBtn.textContent = "开始研究";
  };
});

async function finishUp(taskId) {
  submitBtn.disabled = false;
  submitBtn.textContent = "开始研究";

  const resp = await fetch(`/research/tasks/${taskId}`);
  const data = await resp.json();

  if (data.report_markdown) {
    reportCard.classList.remove("hidden");
    reportDiv.innerHTML = marked.parse(data.report_markdown);
  }
}
</script>
</body>
</html>
