<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KResearch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --paper: #f6f2e7;
    --shell: #ece4cf;
    --core: #fffdf7;
    --hairline: #ddd2b3;
    --ink: #201e19;
    --ink-soft: #6e6554;
    --moss: #33513a;
    --moss-strong: #21331f;
    --moss-wash: #e6ecdf;
    --error: #a34b3c;
    --error-wash: #f3e4e0;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Outfit", -apple-system, sans-serif;
    --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse 800px 480px at 12% -12%, rgba(51, 81, 58, 0.05), transparent 60%),
      radial-gradient(ellipse 600px 420px at 100% 20%, rgba(51, 81, 58, 0.04), transparent 55%);
    display: flex;
    justify-content: center;
    padding: 64px 16px 90px;
    -webkit-font-smoothing: antialiased;
  }

  main { width: 100%; max-width: 660px; }

  /* ---------- header ---------- */
  .mark {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 8px;
  }
  .mark svg { color: var(--moss); flex-shrink: 0; }
  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: -0.2px;
    margin: 0;
    color: var(--ink);
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 6px 0 40px 41px;
    text-wrap: pretty;
  }

  /* ---------- double-bezel card ---------- */
  .card {
    background: var(--shell);
    border: 1px solid var(--hairline);
    border-radius: 22px;
    padding: 7px;
    margin-bottom: 24px;
  }
  .card-inner {
    background: var(--core);
    border-radius: 16px;
    padding: 26px 28px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      0 1px 2px rgba(51, 41, 22, 0.04);
  }

  /* ---------- form ---------- */
  form { display: flex; flex-direction: column; gap: 16px; }
  label {
    font-size: 13px;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 7px;
    font-weight: 500;
  }
  input[type=text], input[type=number] {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    transition: border-color 0.2s var(--ease-spring), box-shadow 0.2s var(--ease-spring);
  }
  input[type=text]:focus, input[type=number]:focus {
    outline: none;
    border-color: var(--moss);
    box-shadow: 0 0 0 3px var(--moss-wash);
  }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .row > div:first-child { flex: 1; }
  .row > div:last-child { width: 128px; }

  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--moss);
    color: var(--core);
    border: none;
    border-radius: 999px;
    padding: 6px 8px 6px 20px;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s var(--ease-spring), background 0.2s var(--ease-spring), box-shadow 0.2s var(--ease-spring);
    box-shadow: 0 1px 2px rgba(33, 51, 31, 0.15);
  }
  button:hover:not(:disabled) { background: var(--moss-strong); box-shadow: 0 3px 10px rgba(33, 51, 31, 0.18); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { background: var(--hairline); color: var(--ink-soft); cursor: not-allowed; box-shadow: none; }
  .btn-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.16);
    flex-shrink: 0;
    transition: transform 0.2s var(--ease-spring);
  }
  button:hover:not(:disabled) .btn-icon { transform: translateX(2px); }
  .btn-icon.sprouting svg { animation: sprout-grow 0.6s var(--ease-spring); }
  @keyframes sprout-grow {
    0% { transform: scaleY(0.2); opacity: 0.4; }
    60% { transform: scaleY(1.15); opacity: 1; }
    100% { transform: scaleY(1); opacity: 1; }
  }

  /* ---------- trail progress ---------- */
  .trail { position: relative; padding-left: 4px; }
  .waypoint {
    position: relative;
    display: flex;
    gap: 14px;
    padding: 4px 0 4px 28px;
  }
  .waypoint::before {
    content: "";
    position: absolute;
    left: 6px;
    top: -4px;
    bottom: -4px;
    width: 1px;
    background: var(--hairline);
  }
  .waypoint:first-child::before { top: 50%; }
  .waypoint:last-child::before { bottom: 50%; }
  .waypoint.walked::before { background: var(--moss); opacity: 0.35; }
  .marker {
    position: absolute;
    left: 0;
    top: 11px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--core);
    border: 2px solid var(--hairline);
    transform: translateY(-50%);
    transition: border-color 0.3s var(--ease-spring), background 0.3s var(--ease-spring);
  }
  .waypoint.walked .marker { border-color: var(--moss); background: var(--moss); opacity: 0.55; }
  .waypoint.current .marker {
    border-color: var(--moss);
    background: var(--moss);
    box-shadow: 0 0 0 5px var(--moss-wash);
  }
  .waypoint.state-done .marker { border-color: var(--moss); background: var(--moss); box-shadow: 0 0 0 5px var(--moss-wash); }
  .waypoint.state-partial .marker { border-color: var(--moss); background: var(--core); }
  .waypoint.state-failed .marker { border-color: var(--error); background: var(--error); box-shadow: 0 0 0 5px var(--error-wash); }
  .waypoint-label { font-size: 15px; padding-top: 3px; color: var(--ink-soft); }
  .waypoint.walked .waypoint-label, .waypoint.current .waypoint-label { color: var(--ink); }
  .waypoint.state-done .waypoint-label { color: var(--moss-strong); font-weight: 600; }
  .waypoint.state-partial .waypoint-label { color: var(--moss-strong); font-weight: 600; }
  .waypoint.state-failed .waypoint-label { color: var(--error); font-weight: 600; }

  .meta {
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- divider ---------- */
  .frond-divider { display: block; width: 100%; height: 22px; margin: -6px 0 24px; color: var(--hairline); }

  /* ---------- report ---------- */
  #report { line-height: 1.75; font-size: 16px; max-width: 62ch; }
  #report h1 {
    font-family: var(--font-display);
    font-size: 25px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 20px;
    text-wrap: balance;
  }
  #report h2 {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 600;
    color: var(--moss-strong);
    margin: 30px 0 11px;
    text-wrap: balance;
  }
  #report h3 { font-family: var(--font-display); font-size: 16px; color: var(--ink); }
  #report p { margin: 0 0 15px; }
  #report a { color: var(--moss-strong); text-decoration-color: var(--hairline); }
  #report code { background: var(--paper); border: 1px solid var(--hairline); padding: 1px 5px; border-radius: 5px; font-size: 14px; }
  #report ul, #report ol { padding-left: 22px; }

  .hidden { display: none; }

  .issues {
    font-size: 13.5px;
    color: var(--moss-strong);
    margin: 22px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
    list-style: none;
  }
  .issues li { margin-bottom: 7px; padding-left: 16px; position: relative; }
  .issues li::before { content: "·"; position: absolute; left: 4px; color: var(--moss); }

  @media (max-width: 480px) {
    body { padding: 40px 14px 60px; }
    .row { flex-direction: column; align-items: stretch; gap: 14px; }
    .row > div:last-child { width: 100%; }
    h1 { font-size: 24px; }
    .subtitle { margin-left: 0; }
    .mark { gap: 10px; }
    .card-inner { padding: 20px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-icon.sprouting svg { animation: none; }
    button, .btn-icon, .marker, input { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21V9"/>
      <path d="M12 15c0-4.5 2-7 6.5-8.5C17.5 11 15 14 12 15Z"/>
      <path d="M12 12c0-4-2-6.5-6.5-8C6 9 8.5 11.5 12 12Z"/>
    </svg>
    <h1>KResearch</h1>
  </div>
  <div class="subtitle">提交一个问题，看它自己踏勘、取证、核实、写成报告</div>

  <div class="card">
    <div class="card-inner">
      <form id="task-form">
        <div class="row">
          <div>
            <label for="query">研究问题</label>
            <input type="text" id="query" placeholder="例如：加拿大的首都是哪里？" required>
          </div>
          <div>
            <label for="budget">预算（$）</label>
            <input type="number" id="budget" value="0.3" step="0.05" min="0.01" required>
          </div>
        </div>
        <button type="submit" id="submit-btn">
          <span id="submit-label">出发探索</span>
          <span class="btn-icon" id="submit-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 20V10"/><path d="M12 13c0-3 1.5-5 5-6-.5 3.5-2 5.5-5 6Z"/><path d="M12 11c0-3-1.5-5-5-6 .5 3.5 2 5.5 5 6Z"/>
            </svg>
          </span>
        </button>
      </form>
    </div>
  </div>

  <div class="card hidden" id="progress-card">
    <div class="card-inner">
      <div class="trail" id="status-lines"></div>
      <div class="meta" id="meta-line"></div>
    </div>
  </div>

  <svg class="frond-divider hidden" id="report-divider" viewBox="0 0 660 22" preserveAspectRatio="none">
    <line x1="0" y1="11" x2="270" y2="11" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="11" x2="660" y2="11" stroke="currentColor" stroke-width="1"/>
    <path d="M330 11c-10-8-8-14 0-14s10 6 0 14Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M330 11c-6 5-4 9 0 9s6-4 0-9Z" fill="currentColor" stroke="none" opacity="0.4"/>
  </svg>

  <div class="card hidden" id="report-card">
    <div class="card-inner">
      <div id="report"></div>
      <ul class="issues hidden" id="issues"></ul>
    </div>
  </div>
</main>

<script>
const PHASES = ["pending", "planning", "executing", "verifying", "synthesizing"];
const PHASE_LABELS = {
  pending: "等待出发",
  planning: "规划路线 — 把问题拆成具体的检索方向",
  executing: "沿途搜索 — 抓取网页、采集资料",
  verifying: "核对证据 — 检查每条说法是否站得住脚",
  synthesizing: "整理见闻 — 写成报告初稿",
  done: "抵达终点",
  partial: "半途而返 — 仍有疑点未解",
  failed: "此路不通",
  cancelled: "中途折返",
  timed_out: "迷路超时",
};

const form = document.getElementById("task-form");
const submitBtn = document.getElementById("submit-btn");
const submitLabel = document.getElementById("submit-label");
const submitIcon = document.getElementById("submit-icon");
const progressCard = document.getElementById("progress-card");
const statusLines = document.getElementById("status-lines");
const metaLine = document.getElementById("meta-line");
const reportDivider = document.getElementById("report-divider");
const reportCard = document.getElementById("report-card");
const reportDiv = document.getElementById("report");
const issuesList = document.getElementById("issues");

const TERMINAL = ["done", "partial", "failed", "cancelled", "timed_out"];

function renderTrail(current, spent, budget) {
  statusLines.innerHTML = "";
  const isTerminal = TERMINAL.includes(current);
  const sequence = isTerminal ? [...PHASES, current] : PHASES.slice(0, PHASES.indexOf(current) + 1);

  sequence.forEach((phase, i) => {
    const el = document.createElement("div");
    let cls = "waypoint";
    if (isTerminal && i === sequence.length - 1) {
      cls += ` state-${phase === "cancelled" || phase === "timed_out" ? "failed" : phase}`;
    } else if (i < sequence.length - 1 || (!isTerminal && phase === current)) {
      cls += i < sequence.length - 1 ? " walked" : " current";
    }
    el.className = cls;
    el.innerHTML = `<div class="marker"></div><div class="waypoint-label">${PHASE_LABELS[phase] || phase}</div>`;
    statusLines.appendChild(el);
  });

  metaLine.style.color = "";
  metaLine.textContent = `花费 $${spent.toFixed(6)} / $${budget.toFixed(4)}`;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = document.getElementById("query").value.trim();
  const budget = parseFloat(document.getElementById("budget").value);
  if (!query) return;

  submitBtn.disabled = true;
  submitIcon.classList.add("sprouting");
  submitLabel.textContent = "正在出发…";
  progressCard.classList.remove("hidden");
  reportCard.classList.add("hidden");
  reportDivider.classList.add("hidden");
  issuesList.classList.add("hidden");
  statusLines.innerHTML = "";
  metaLine.textContent = "";
  metaLine.style.color = "";

  let resp;
  try {
    resp = await fetch("/research/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, budget }),
    });
  } catch (err) {
    showError("连不上服务——后端服务是不是没启动？（" + err.message + "）");
    resetButton();
    return;
  }
  if (!resp.ok) {
    showError("提交失败：服务器返回了 " + resp.status);
    resetButton();
    return;
  }
  const { task_id } = await resp.json();

  const es = new EventSource(`/research/tasks/${task_id}/stream`);
  let gotFirstEvent = false;
  es.onmessage = (event) => {
    gotFirstEvent = true;
    const data = JSON.parse(event.data);
    renderTrail(data.status, data.spent, data.budget);
    if (TERMINAL.includes(data.status)) {
      es.close();
      finishUp(task_id);
    }
  };
  es.onerror = () => {
    es.close();
    if (!gotFirstEvent) {
      showError("进度连接断了，还没收到任何更新——服务器可能中途挂了，或者正在重启。");
    } else {
      showError("进度连接断了（服务器可能重启了）。任务可能还在后台跑，刷新页面看不到进度，但报告跑完会存在服务器上。");
    }
    resetButton();
  };
});

function showError(message) {
  metaLine.textContent = message;
  metaLine.style.color = "var(--error)";
}

function resetButton() {
  submitBtn.disabled = false;
  submitIcon.classList.remove("sprouting");
  submitLabel.textContent = "出发探索";
}

async function finishUp(taskId) {
  resetButton();

  const resp = await fetch(`/research/tasks/${taskId}`);
  const data = await resp.json();

  if (data.report_markdown) {
    reportDivider.classList.remove("hidden");
    reportCard.classList.remove("hidden");
    reportDiv.innerHTML = marked.parse(data.report_markdown);
  }
}
</script>
</body>
</html>
