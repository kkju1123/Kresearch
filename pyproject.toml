[project]
name = "kresearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "keke", email = "kkju1123@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "openai>=3.17.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "tavily-python>=0.8.4",
    "trafilatura>=2.2.0",
    "typer>=0.27.2",
]

[project.scripts]
kresearch = "kresearch.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
